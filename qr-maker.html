<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>QR Code Maker · Heart & Diaphragm Pump</title><style>body{font-family:system-ui,-apple-system,sans-serif;margin:0;background:#0b1629;color:#eaf5ff}main{max-width:560px;margin:6vh auto;padding:24px}h1{line-height:1.2}p{color:#b7cadc;line-height:1.6}label{display:block;margin:24px 0 8px;font-weight:700}input{width:100%;padding:15px;border-radius:10px;background:white;color:#192434;border:0;font-size:15px;box-sizing:border-box}button,a.download{display:inline-block;border:0;padding:13px 18px;border-radius:9px;background:#62d4ee;color:#091528;font-weight:800;font-size:15px;margin-top:14px;cursor:pointer;text-decoration:none}#qr{background:#fff;display:none;justify-content:center;width:max-content;max-width:100%;padding:18px;border-radius:15px;margin:25px 0}#qr img{max-width:100%}.small{font-size:13px}#error{color:#ffb5b5}</style></head><body><main><h1>Scan to explore ❤️ ⚙️</h1><p>After hosting <strong>index.html</strong>, paste the public HTTPS address below to create a downloadable, print-ready QR code.</p><label for="site">Public website URL</label><input id="site" type="url" placeholder="https://your-username.github.io/heart-pump/" autocomplete="url"><button id="make">Generate QR code</button><p id="error" role="alert"></p><div id="qr" aria-label="QR code"></div><a class="download" id="save" style="display:none">Download QR as PNG</a><p class="small">QR generation uses the open-source QRCode.js library loaded from a CDN. The QR represents only the URL you enter.</p></main><script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script><script>document.getElementById('make').addEventListener('click',function(){const v=document.getElementById('site').value.trim(),err=document.getElementById('error'),el=document.getElementById('qr'),save=document.getElementById('save');err.textContent='';save.style.display='none';el.style.display='none';try{const url=new URL(v);if(url.protocol!=='https:')throw Error('Enter a public HTTPS website address.');if(typeof QRCode==='undefined')throw Error('QR library failed to load. Connect to the internet and refresh.');el.innerHTML='';new QRCode(el,{text:url.href,width:270,height:270,colorDark:'#07111f',colorLight:'#ffffff',correctLevel:QRCode.CorrectLevel.H});el.style.display='flex';setTimeout(()=>{let canvas=el.querySelector('canvas'),img=el.querySelector('img');if(canvas){save.href=canvas.toDataURL('image/png')}else if(img){save.href=img.src}else{return}save.download='heart-diaphragm-pump-qr.png';save.style.display='inline-block'},150)}catch(e){err.textContent=e.message}})</script></body></html>
